[package]
name = "botracing"
version = "0.1.1"
description = "BotRacing tray uploader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-updater = "2"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
urlencoding = "2"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-single-instance = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
parquet = { version = "60.0.0", features = ["arrow", "zstd"] }
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading"] }
