<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BotRacing</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #e4e7ea; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .mark { width: 40px; height: 40px; }
  .line { display: flex; align-items: center; gap: 10px; font-size: 16px; }
  .check { width: 18px; height: 18px; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 18 18" aria-hidden="true">
    <rect x="0.5" y="0.5" width="17" height="17" rx="4" fill="#15181c" stroke="#3a4148"/>
    <line x1="3" x2="15" y1="10.5" y2="10.5" stroke="#3a4148"/>
    <path d="M3 13 C5 13 5.4 5 7.8 5 S10.4 11.5 12 11.5 S14 8.2 15 7.8" fill="none" stroke="#f2f4f6" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="11" x2="11" y1="3" y2="15" stroke="#fea92f" stroke-width="1.3"/>
  </svg>
  <p class="line">
    <svg class="check" viewBox="0 0 18 18" aria-hidden="true">
      <circle cx="9" cy="9" r="8" fill="none" stroke="#fea92f" stroke-width="1.4"/>
      <path d="M5.5 9.5 L8 12 L12.5 6.5" fill="none" stroke="#fea92f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Signed in</span>
  </p>
</main>
<script>
  setTimeout(function () { window.close(); }, 1500);
</script>
</body>
</html>
