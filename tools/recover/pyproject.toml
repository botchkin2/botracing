[project]
name = "lap-recover"
version = "0.1.0"
description = "Rebuilds a session's field from LMU's own replay (.Vcr); read-only, see vcrField.py."
requires-python = ">=3.13"
dependencies = ["numpy>=2.1", "duckdb>=1.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
