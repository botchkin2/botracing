<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Follow cam</title>
<style>
  :root{
    --bg:#07090c; --glass:rgba(10,13,18,.62); --glass2:rgba(10,13,18,.82); --line:rgba(255,255,255,.12);
    --text:#eef2f6; --muted:#8e99a8; --accent:#ffb020; --good:#39e08a; --bad:#ff5a4d; --blue:#5cc8ff;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif; color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;user-select:none}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.42) 100%)}
  .glass{position:absolute;background:var(--glass);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .mono{font-family:"IBM Plex Mono","Cascadia Mono","SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums}

  /* who + nearby */
  #who{left:14px;top:14px;width:250px;padding:10px 12px}
  #who .l1{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
  #who .cb{padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.6px;color:#06090d}
  #who .l2{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #who .l3{display:flex;gap:6px;margin-top:8px;align-items:center}
  #who .sec{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
  #who .sec.on{background:var(--accent)}
  #who .tag{font-size:11px;color:var(--muted);min-width:46px;text-align:right}
  #near{left:14px;top:106px;width:250px;padding:5px}
  #near .row{display:grid;grid-template-columns:30px 40px 1fr auto;gap:6px;align-items:center;padding:5px 7px;border-radius:6px;cursor:pointer;font-size:12.5px}
  #near .row:hover{background:rgba(255,255,255,.06)}
  #near .row.me{background:rgba(255,255,255,.12);cursor:default}
  #near .cb{padding:0 5px;border-radius:3px;font-size:10px;font-weight:700;color:#06090d;text-align:center}
  #near .t{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #near .g{font-size:12px;text-align:right}
  #near .g.c{color:var(--bad)} #near .g.f{color:var(--good)}
  #strip{left:50%;transform:translateX(-50%);top:14px;width:min(560px,calc(100vw - 560px));height:64px;padding:0;overflow:hidden}
  #strip canvas{width:100%;height:100%;display:block}

  /* map + profile */
  #mapwrap{right:14px;top:14px;width:210px;height:210px;padding:0;overflow:hidden}
  #profwrap{right:14px;top:234px;width:210px;height:84px;padding:0;overflow:hidden}
  #mapwrap canvas,#profwrap canvas{width:100%;height:100%;display:block}

  /* bottom stack: dash above a collapsible replay bar, so they never overlap */
  #bottom{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
  #bottom>*{pointer-events:auto;position:relative}
  #dash{padding:10px 20px 12px;display:flex;align-items:center;gap:22px;background:var(--glass2);max-width:100%}
  #gear{font-size:44px;font-weight:600;color:var(--accent);width:34px;text-align:center;line-height:1}
  #spdbox{min-width:118px}
  #spd{font-size:52px;font-weight:600;line-height:.95;letter-spacing:-1px}
  #spdu{font-size:11px;color:var(--muted);margin-left:4px;letter-spacing:.5px}
  #leds{display:flex;gap:3px;margin-top:8px}
  #leds i{width:7px;height:5px;border-radius:2px;background:rgba(255,255,255,.1)}
  .pedals{display:flex;gap:6px;height:56px}
  .pedal{width:12px;border-radius:4px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
  .pedal i{position:absolute;left:0;right:0;bottom:0;display:block;transition:height .05s linear}
  #est{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-size:9px;letter-spacing:1px;padding:1px 6px;border-radius:3px;background:#1a2230;color:var(--muted);border:1px solid var(--line);display:none;white-space:nowrap}
  .kv{display:flex;flex-direction:column;gap:1px;min-width:62px}
  .kv small{font-size:10px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
  .kv b{font-size:20px;font-weight:500}

  /* replay bar: one slim row; the rest opens on demand */
  #bar{width:min(720px,100%);padding:6px 10px;display:flex;flex-direction:column;gap:8px}
  #bar .core{display:flex;gap:10px;align-items:center}
  #bar .xtra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding-top:2px}
  #bar.collapsed .xtra{display:none}
  #more svg{transition:transform .2s} #bar:not(.collapsed) #more svg{transform:rotate(180deg)}
  button{font:inherit;font-size:13px;color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:0 12px;height:34px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  button:hover{background:var(--overlay)}
  button.on{background:rgba(254,169,47,.13);border-color:var(--accent);color:var(--accent)}
  #clock{font-size:15px;min-width:52px}
  #seek{flex:1;min-width:80px;accent-color:var(--accent);height:34px}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:transparent;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:rgba(254,169,47,.13);color:var(--accent)}
  .ico{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* inputs wheel, elevation gauge, class bests */
  .brk{display:none}
  #wheelsvg{width:52px;height:52px;flex:0 0 auto}
  #eg{position:relative;width:200px;height:56px;flex:0 0 auto}
  #egc{width:100%;height:100%;display:block}
  #eg .egn{position:absolute;left:0;top:-2px;display:flex;gap:10px;font-size:11px;color:var(--muted)}
  #eg .egn span:first-child{color:var(--text);font-size:13px}
  #best{display:flex;gap:6px;padding:5px 6px;position:relative}
  #best .b{display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.05);font-size:12px;white-space:nowrap}
  #best .cb{padding:0 5px;border-radius:3px;font-size:10px;font-weight:700;color:#06090d}
  #best small{color:var(--muted);font-size:10.5px}
  #best .d{color:var(--muted);font-size:11px}
  @media (min-width:1100px){
    #best{position:fixed;right:14px;bottom:14px;flex-direction:column;gap:4px;padding:8px;width:218px}
    #best .b{justify-content:space-between;font-size:13px}
    #best h6{margin:0 0 2px;font-size:10px;letter-spacing:.8px;color:var(--muted);font-weight:600;text-transform:uppercase}
  }
  @media (max-width:1099px){ #best h6{display:none} }

  /* floating chips over cars */
  #chips{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .chip{position:absolute;transform:translate(-50%,-100%);padding:2px 7px 2px 5px;border-radius:5px;background:rgba(8,10,14,.72);font-size:11.5px;display:flex;gap:5px;align-items:center;white-space:nowrap;will-change:transform}
  .chip i{width:7px;height:7px;border-radius:2px;display:block}
  #toast{left:50%;top:16px;transform:translateX(-50%);padding:6px 14px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;opacity:0;transition:opacity .25s;pointer-events:none}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:13px;letter-spacing:1px;transition:opacity .5s;z-index:9}
  #load.gone{opacity:0;pointer-events:none}

  @media (max-width:760px){
    #who{left:8px;top:8px;width:auto;right:108px;padding:8px 10px}
    #near,#profwrap{display:none}
    #strip{left:8px;right:8px;transform:none;top:106px;width:auto;height:46px}
    #mapwrap{width:92px;height:92px;right:8px;top:8px}
    #bottom{left:8px;right:8px;bottom:8px;gap:8px}
    #dash{gap:10px 12px;padding:8px 12px;flex-wrap:wrap;justify-content:center}
    .brk{display:block;flex:1 1 100%;height:0}
    #eg{flex:1 1 120px;width:auto;height:46px}
    #wheelsvg{width:44px;height:44px} #gball{width:44px !important;height:44px !important}
    #best{padding:4px;justify-content:center;flex-wrap:wrap}
    #spd{font-size:42px} #gear{font-size:34px;width:26px} #spdbox{min-width:92px}
    #bar .xtra{justify-content:flex-start}
    button{height:36px}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vig"></div>
<div id="chips"></div>

<div id="who" class="glass"></div>
<div id="near" class="glass mono"></div>
<div id="strip" class="glass"><canvas id="stripc"></canvas></div>
<div id="mapwrap" class="glass"><canvas id="mapc"></canvas></div>
<div id="profwrap" class="glass"><canvas id="profc"></canvas></div>

<div id="bottom">
<div id="best" class="glass mono"></div>
<div id="dash" class="glass mono"><div id="est">EST</div>
  <div id="gear">N</div>
  <div id="spdbox"><span id="spd">0</span><span id="spdu">KM/H</span><div id="leds"></div></div>
  <div class="pedals" id="pedals"><div class="pedal" title="Brake"><i id="pBrake" style="background:var(--bad)"></i></div><div class="pedal" title="Throttle"><i id="pThr" style="background:var(--good)"></i></div></div>
  <div class="brk"></div>
  <svg id="wheelsvg" viewBox="-26 -26 52 52" title="Steering"><circle r="20" fill="none" stroke="#3a4350" stroke-width="3.5"/><g id="wheel"><path d="M-20 0H20M0 0V20" stroke="#eef2f6" stroke-width="3.5" stroke-linecap="round"/><path d="M-5 -20h10" stroke="#ffb020" stroke-width="4" stroke-linecap="round"/></g></svg>
  <canvas id="gball" width="112" height="112" style="width:52px;height:52px" title="Acceleration"></canvas>
  <div id="eg" title="Height: 100 m behind, 500 m ahead"><canvas id="egc"></canvas><div class="egn mono"><span id="grade">0.0%</span><span id="alt">0 m</span></div></div>
</div>
<div id="bar" class="glass collapsed">
  <div class="core">
    <button id="play" title="Pause (Space)" aria-label="Pause"><svg class="ico" viewBox="0 0 14 14" id="playico" style="fill:currentColor;stroke:none"><rect x="2" y="1" width="3.4" height="12"/><rect x="8.6" y="1" width="3.4" height="12"/></svg></button>
    <span id="clock" class="mono">0:00.0</span>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <button id="more" title="More controls (M)"><svg class="ico" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  </div>
  <div class="xtra">
    <div class="seg"><button id="slower" title="Slower ([)">&minus;</button><button id="spdx" class="mono" style="min-width:46px;justify-content:center" disabled>1&times;</button><button id="faster" title="Faster (])">+</button></div>
    <div class="seg" id="cams"></div>
    <div class="seg" id="classes"></div>
    <div class="seg"><button id="relief" title="Relief exaggeration (E)">Relief 1&times;</button><button id="theme" title="Day / dusk (T)">Day</button><button id="line" class="on" title="Pedal inputs on the road (L)">Inputs</button></div>
  </div>
</div>
</div>
<div id="toast" class="glass"></div>
<div id="load">LOADING</div>

<script src="data-portimao.js"></script>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
<script type="module" src="main.js"></script>
</body>
</html>
