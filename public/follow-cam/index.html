<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow cam prototype</title>
<style>
  :root{
    --bg:#0b0d10; --panel:rgba(12,14,18,.72); --line:rgba(255,255,255,.14); --text:#e9edf2; --muted:#98a2b0;
    --accent:#ffb020; --good:#3ddc84; --bad:#ff5a4d;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
  canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block}
  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(6px)}
  .mono{font-family:"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
  #title{left:16px;top:16px;padding:10px 14px}
  #title b{font-size:15px}
  #title div{color:var(--muted);font-size:12px;margin-top:2px}
  #tower{left:16px;top:84px;width:232px;padding:6px}
  #tower .row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13px}
  #tower .row:hover{background:rgba(255,255,255,.07)}
  #tower .row.sel{background:rgba(255,176,32,.16);outline:1px solid rgba(255,176,32,.5)}
  #tower .pos{width:20px;color:var(--muted)}
  #tower .sw{width:10px;height:10px;border-radius:2px}
  #tower .nm{flex:1}
  #tower .gap{color:var(--muted);font-size:12px}
  #map{right:16px;top:16px;width:236px;height:236px;padding:0}
  #map canvas{width:100%;height:100%;display:block;border-radius:8px}
  #profile{right:16px;top:262px;width:236px;height:92px;padding:0}
  #profile canvas{width:100%;height:100%;display:block;border-radius:8px}
  #dash{right:16px;bottom:84px;padding:10px 16px;display:flex;gap:22px;align-items:center}
  #dash .big{font-size:40px;font-weight:600;line-height:1}
  #dash .unit{font-size:11px;color:var(--muted);margin-left:4px}
  #dash .gear{font-size:34px;color:var(--accent);width:28px;text-align:center}
  .bars{display:flex;gap:6px;height:44px;align-items:flex-end}
  .bar{width:12px;height:44px;background:rgba(255,255,255,.08);border-radius:3px;position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;right:0;bottom:0;display:block}
  #rpm{width:160px;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:8px}
  #rpm i{display:block;height:100%;background:linear-gradient(90deg,#3ddc84,#ffb020 75%,#ff5a4d)}
  #steer{width:44px;height:44px}
  #bar{left:16px;right:16px;bottom:16px;padding:10px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  button{font:inherit;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;min-height:32px}
  button:hover{background:rgba(255,255,255,.16)}
  button.on{background:rgba(255,176,32,.2);border-color:rgba(255,176,32,.6);color:#ffd58a}
  input[type=range]{accent-color:var(--accent)}
  #seek{flex:1;min-width:200px}
  .grp{display:flex;gap:6px;align-items:center}
  .lbl{color:var(--muted);font-size:12px}
  #toast{left:50%;top:18px;transform:translateX(-50%);padding:6px 12px;font-size:13px;opacity:0;transition:opacity .3s}
  #hint{right:16px;top:364px;padding:8px 10px;font-size:11px;color:var(--muted);line-height:1.6;width:236px}
  kbd{background:rgba(255,255,255,.1);border-radius:3px;padding:0 4px;color:var(--text)}
  @media (max-width:900px){ #hint{display:none} #tower{width:190px} #dash{bottom:150px;right:8px;gap:12px;transform:scale(.85);transform-origin:bottom right} }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="title" class="panel"><b>Follow cam</b><div id="sub">Spa-Francorchamps · five of your own race laps, raced against each other</div></div>
<div id="tower" class="panel"></div>
<div id="map" class="panel"><canvas id="mapc"></canvas></div>
<div id="profile" class="panel"><canvas id="profc"></canvas></div>
<div id="hint" class="panel">
  <kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> ±5 s · <kbd>[</kbd><kbd>]</kbd> speed<br>
  <kbd>1</kbd> chase <kbd>2</kbd> high <kbd>3</kbd> hood <kbd>4</kbd> TV <kbd>5</kbd> heli<br>
  <kbd>Tab</kbd> next car · <kbd>E</kbd> relief × · <kbd>T</kbd> dusk · <kbd>L</kbd> inputs line
</div>

<div id="dash" class="panel mono">
  <div class="gear" id="gear">N</div>
  <div><span class="big" id="spd">0</span><span class="unit">km/h</span><div id="rpm"><i></i></div></div>
  <div class="bars"><div class="bar" title="brake"><i id="bBrake" style="background:var(--bad)"></i></div><div class="bar" title="throttle"><i id="bThr" style="background:var(--good)"></i></div></div>
  <svg id="steer" viewBox="-22 -22 44 44"><circle r="18" fill="none" stroke="#98a2b0" stroke-width="3"/><g id="wheel"><line x1="-18" x2="18" stroke="#e9edf2" stroke-width="3"/><line y1="0" y2="-18" stroke="#ffb020" stroke-width="3"/></g></svg>
  <div><div class="lbl">grade</div><div id="grade" style="font-size:18px">0.0%</div></div>
  <div><div class="lbl">altitude</div><div id="alt" style="font-size:18px">0 m</div></div>
</div>

<div id="bar" class="panel">
  <button id="play">Pause</button>
  <span class="mono" id="clock" style="min-width:128px">0:00.0</span>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <div class="grp"><span class="lbl">speed</span><button id="slower">−</button><span class="mono" id="spdx" style="min-width:34px;text-align:center">1×</span><button id="faster">+</button></div>
  <div class="grp" id="cams"></div>
  <div class="grp"><span class="lbl">relief</span><input id="relief" type="range" min="1" max="5" step="0.5" value="1" style="width:90px"><span class="mono" id="reliefv">1×</span></div>
  <button id="dusk">Dusk</button>
  <button id="line" class="on">Inputs on road</button>
</div>
<div id="toast" class="panel"></div>

<script src="data-spa.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------------------------------
// Follow cam prototype. Everything on screen is built from recorded data:
//   road      centre path + asphalt edges measured from PathLateral / TrackEdge (5 m bins)
//   elevation real terrain model (EU-DEM 25 m) sampled along that centre path
//   cars      five of the player's own race laps, replayed at once from a common start
//   inputs    throttle / brake of the followed lap, painted on the road ahead of it
// A tiny 3D engine (perspective, painter's order by view depth) draws it on a 2D canvas.
// ---------------------------------------------------------------------------------------
const D = window.FOLLOW_DATA, R = D.road, N = R.cx.length, BIN = D.bin, LEN = N * BIN, HZ = D.hz;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = mod(b - a + Math.PI, TAU) - Math.PI; return d; };

// ---- road precompute -----------------------------------------------------------------
const hdg = new Float64Array(N), rnx = new Float64Array(N), rny = new Float64Array(N), curv = new Float64Array(N);
for (let i = 0; i < N; i++) {
  const a = (i - 1 + N) % N, b = (i + 1) % N;
  hdg[i] = Math.atan2(R.cy[b] - R.cy[a], R.cx[b] - R.cx[a]);
  rnx[i] = Math.sin(hdg[i]); rny[i] = -Math.cos(hdg[i]);
}
for (let i = 0; i < N; i++) {
  let s = 0;
  for (let k = -3; k < 3; k++) s += angDiff(hdg[mod(i + k, N)], hdg[mod(i + k + 1, N)]);
  curv[i] = s / (6 * BIN);                 // rad per metre, + = turning left
}
const zMin = Math.min(...R.z);
let relief = 1;
const zRaw = s => { const f = mod(s / BIN, N), i = Math.floor(f), t = f - i; return lerp(R.z[i], R.z[(i + 1) % N], t); };
const roadZ = s => zMin + (zRaw(s) - zMin) * relief;
const gradeAt = s => (zRaw(s + 6) - zRaw(s - 6)) / 12;

// ---- cars (laps) ---------------------------------------------------------------------
const PALETTE = ['#ffb020', '#4fc3f7', '#ff5a4d', '#7bdc6a', '#c58bff'];
const cars = D.laps.map((L, k) => {
  const n = L.x.length;
  const h = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.max(0, i - 2), b = Math.min(n - 1, i + 2);
    h[i] = Math.atan2(L.y[b] - L.y[a], L.x[b] - L.x[a]);
  }
  for (let i = 1; i < n; i++) h[i] = h[i - 1] + angDiff(h[i - 1], h[i]);   // unwrap
  const ld = L.ld.slice();
  for (let i = 0; i < n; i++) if (ld[i] > LEN * 0.9 && i < 30) ld[i] -= LEN;  // sample just before the line
  // heading, lightly smoothed
  const hs = new Float64Array(n);
  for (let i = 0; i < n; i++) { let s = 0, c = 0; for (let j = -2; j <= 2; j++) { const q = clamp(i + j, 0, n - 1); s += h[q]; c++; } hs[i] = s / c; }
  return { k, L, n, dur: (n - 1) / HZ, h: hs, ld, color: PALETTE[k], name: 'Lap ' + L.no, lapTime: L.time };
});
const fmtLap = s => { const m = Math.floor(s / 60); return m + ':' + (s - m * 60).toFixed(3).padStart(6, '0'); };
cars.forEach(c => c.name = 'Lap ' + c.L.no + ' · ' + fmtLap(c.lapTime));

const GRID_S = 0.42;   // each car starts this much later than the one in front: a rolling grid
function carAt(c, t0) {
  let t = t0 - c.k * GRID_S;
  const back = t < 0 ? -t : 0;   // before its start the car trails behind the line at the lap's opening speed
  if (t < 0) t = 0;
  const lapsDone = Math.floor(t / c.dur);
  const tt = mod(t, c.dur) * HZ;
  const i = clamp(Math.floor(tt), 0, c.n - 2), f = tt - i, L = c.L;
  const g = (arr, j) => arr[clamp(j, 0, c.n - 1)];
  const cr = (arr) => {   // Catmull-Rom
    const p0 = g(arr, i - 1), p1 = g(arr, i), p2 = g(arr, i + 1), p3 = g(arr, i + 2);
    return 0.5 * ((2 * p1) + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (-p0 + 3 * p1 - 3 * p2 + p3) * f * f * f);
  };
  const li = arr => lerp(arr[i], arr[i + 1], f);
  let x = cr(L.x), y = cr(L.y);
  let ldv = mod(li(c.ld), LEN);
  const hd = li(c.h);
  // grid: two-wide stagger that closes up over the first 350 m of the first lap
  if (lapsDone === 0) {
    const run = clamp(1 - (t * L.v[0]) / 350, 0, 1);
    const off = ((c.k & 1) ? 1 : -1) * 2.4 * run;
    x += -Math.sin(hd) * off; y += Math.cos(hd) * off;
  }
  if (back > 0) { x -= Math.cos(L.hd0 ?? hd) * back * L.v[0]; y -= Math.sin(L.hd0 ?? hd) * back * L.v[0]; ldv = mod(ldv - back * L.v[0], LEN); }
  const z = roadZ(ldv);
  const pitch = Math.atan2(roadZ(ldv + 2.5) - roadZ(ldv - 2.5), 5);
  return {
    x, y, z, hd, ld: ldv, pitch, v: li(L.v), th: li(L.th), br: li(L.br), st: li(L.st), gear: L.gear[Math.round(tt) < c.n ? Math.round(tt) : c.n - 1],
    rpm: li(L.rpm), gl: li(L.gl), progress: back > 0 ? -back * L.v[0] : lapsDone * LEN + ldv, lapsDone, lapT: mod(t, c.dur),
  };
}

// ---- scenery: trees, stands ----------------------------------------------------------
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const trees = [];
for (let i = 0; i < N; i += 1) {
  for (const side of [-1, 1]) {
    if (rnd() < 0.55) {
      const off = 13 + rnd() * rnd() * 70;
      const w = side < 0 ? R.hl[i] : R.hr[i];
      trees.push({ i, side, off: w + off, h: 7 + rnd() * 10, g: rnd(), j: (rnd() - .5) * 2, lat: 0 });
    }
  }
}
const treeBins = Array.from({ length: N }, () => []);
trees.forEach((t, k) => treeBins[t.i].push(k));

// ---- colours -------------------------------------------------------------------------
const THEMES = {
  day: { skyTop: [70, 128, 205], skyHor: [200, 225, 245], fog: [188, 212, 232], sun: [1, .96, .86], light: [0.55, -0.35, 0.75],
         grassA: [76, 135, 58], grassB: [70, 126, 53], roadA: [74, 77, 82], roadB: [69, 72, 77], hills: [[104, 134, 160], [88, 120, 140]], amb: .62, night: 0 },
  dusk: { skyTop: [24, 34, 74], skyHor: [244, 150, 84], fog: [170, 118, 108], sun: [1, .62, .32], light: [0.8, -0.2, 0.35],
          grassA: [42, 78, 46], grassB: [38, 72, 42], roadA: [52, 52, 60], roadB: [48, 48, 56], hills: [[70, 60, 100], [52, 46, 84]], amb: .38, night: 1 },
};
let theme = THEMES.day, themeName = 'day';
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = (c, k = 1) => `rgb(${Math.round(c[0] * k)},${Math.round(c[1] * k)},${Math.round(c[2] * k)})`;
const FOG_START = 90, FOG_END = 900;
const fogged = (c, d) => mix(c, theme.fog, Math.pow(clamp((d - FOG_START) / (FOG_END - FOG_START), 0, 1), 0.9));

// ---- camera --------------------------------------------------------------------------
const cam = { x: 0, y: 0, z: 0, fx: 1, fy: 0, fz: 0, roll: 0, fov: 70 * Math.PI / 180, init: false };
let basis = null;
function setBasis() {
  const fl = Math.hypot(cam.fx, cam.fy, cam.fz);
  const f = [cam.fx / fl, cam.fy / fl, cam.fz / fl];
  let r = [f[1], -f[0], 0]; const rl = Math.hypot(r[0], r[1]) || 1; r = [r[0] / rl, r[1] / rl, 0];
  let u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  // r x f points up? ensure up has +z
  u = [f[1] * r[2] - f[2] * r[1], f[2] * r[0] - f[0] * r[2], f[0] * r[1] - f[1] * r[0]];
  if (u[2] < 0) u = u.map(v => -v);
  const c = Math.cos(cam.roll), s = Math.sin(cam.roll);
  const r2 = [r[0] * c + u[0] * s, r[1] * c + u[1] * s, r[2] * c + u[2] * s];
  const u2 = [u[0] * c - r[0] * s, u[1] * c - r[1] * s, u[2] * c - r[2] * s];
  basis = { f, r: r2, u: u2 };
}
let W = 1, H = 1, focal = 1;
function toCam(x, y, z, out) {
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z, b = basis;
  out[0] = dx * b.r[0] + dy * b.r[1] + dz * b.r[2];
  out[1] = dx * b.u[0] + dy * b.u[1] + dz * b.u[2];
  out[2] = dx * b.f[0] + dy * b.f[1] + dz * b.f[2];
  return out;
}
const NEAR = 0.4;
// project polygon (array of [x,y,z] world) -> array of screen [sx,sy] with near-plane clipping; returns {pts, depth}
const tmpA = [0, 0, 0];
function clipPoly(world) {
  const cs = world.map(p => toCam(p[0], p[1], p[2], [0, 0, 0]));
  const out = [];
  for (let i = 0; i < cs.length; i++) {
    const a = cs[i], b = cs[(i + 1) % cs.length];
    const ain = a[2] >= NEAR, bin = b[2] >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin) { const t = (NEAR - a[2]) / (b[2] - a[2]); out.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t), NEAR]); }
  }
  if (out.length < 3) return null;
  return clipRect(out.map(p => [W / 2 + p[0] / p[2] * focal, H / 2 - p[1] / p[2] * focal]));
}
// Near-plane clipping leaves points thousands of pixels away; canvas rasterises those badly
// (black slabs), so cut every polygon to the viewport plus a margin.
function clipRect(poly0) {
  let pts = poly0;
  const M = 60;
  const edges = [[0, -M, 1], [0, W + M, -1], [1, -M, 1], [1, H + M, -1]];  // axis, bound, inside sign
  for (const [ax, bound, sg] of edges) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const ain = (a[ax] - bound) * sg >= 0, bin = (b[ax] - bound) * sg >= 0;
      if (ain) out.push(a);
      if (ain !== bin) { const t = (bound - a[ax]) / (b[ax] - a[ax]); out.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t)]); }
    }
    pts = out;
    if (pts.length < 3) return null;
  }
  return pts;
}
function proj(x, y, z) {
  toCam(x, y, z, tmpA);
  if (tmpA[2] < NEAR) return null;
  return [W / 2 + tmpA[0] / tmpA[2] * focal, H / 2 - tmpA[1] / tmpA[2] * focal, tmpA[2]];
}
const depthOf = (x, y, z) => { toCam(x, y, z, tmpA); return tmpA[2]; };

// ---- state ---------------------------------------------------------------------------
const view = document.getElementById('view'), ctx = view.getContext('2d');
let t = 0, playing = true, rate = 1, camMode = 1, follow = 0, showLine = true;
const CAM_NAMES = ['Chase', 'High', 'Hood', 'TV', 'Heli'];
const RATES = [0.25, 0.5, 1, 2, 4, 8];
const RACE_LAPS = 3;
const maxT = Math.min(...cars.map(c => c.dur)) * RACE_LAPS;

// ---- camera rigs ---------------------------------------------------------------------
let tvRig = null;
function rigAt(bi) {
  const i = mod(bi, N);
  const side = (Math.sin(bi * 12.9898) > 0) ? 1 : -1;
  const off = (side > 0 ? R.hr[i] : R.hl[i]) + 16;
  return { s: i * BIN, x: R.cx[i] + rnx[i] * side * off, y: R.cy[i] + rny[i] * side * off, z: roadZ(i * BIN) + 4.5 };
}
const RIG_EVERY = 70; // bins = 350 m
function updateCam(dt, me) {
  const k = 1 - Math.exp(-dt * 6);
  const dirx = Math.cos(me.hd), diry = Math.sin(me.hd);
  let px, py, pz, lx, ly, lz, fov = 70, rollT = 0;
  const pitchBias = me.pitch;
  if (camMode === 1 || camMode === 2) {
    const back = camMode === 1 ? 7.5 : 15, up = camMode === 1 ? 2.6 : 6.5;
    if (!cam.init || cam.mode !== camMode) { cam.yaw = me.hd; cam.mode = camMode; }
    cam.yaw += angDiff(cam.yaw, me.hd) * (1 - Math.exp(-dt * 3.2));
    const cx = Math.cos(cam.yaw), cy = Math.sin(cam.yaw);
    px = me.x - cx * back; py = me.y - cy * back;
    pz = Math.max(me.z + up, roadZ(me.ld - back) + 1.3);
    lx = me.x + cx * 22; ly = me.y + cy * 22; lz = roadZ(me.ld + 22) + (camMode === 1 ? 2.2 : 0.2);
    fov = 66 + clamp(me.v / 90, 0, 1) * 14; rollT = clamp(-me.gl * 0.035, -0.12, 0.12);
  } else if (camMode === 3) {
    px = me.x + dirx * 0.3; py = me.y + diry * 0.3; pz = me.z + 1.15;
    lx = me.x + dirx * 30; ly = me.y + diry * 30; lz = roadZ(me.ld + 30) + 1.1;
    fov = 88; rollT = clamp(-me.gl * 0.03, -0.1, 0.1);
  } else if (camMode === 4) {
    if (!tvRig) tvRig = rigAt(Math.floor(me.ld / BIN / RIG_EVERY) * RIG_EVERY + RIG_EVERY);
    let ahead = mod(tvRig.s - me.ld + LEN / 2, LEN) - LEN / 2;
    if (ahead < -50 || ahead > 520) tvRig = rigAt(Math.ceil((me.ld + 120) / BIN / RIG_EVERY) * RIG_EVERY);
    px = tvRig.x; py = tvRig.y; pz = tvRig.z;
    lx = me.x + dirx * 4; ly = me.y + diry * 4; lz = me.z + 0.8;
    const dist = Math.hypot(lx - px, ly - py, lz - pz);
    fov = clamp(2 * Math.atan(16 / Math.max(dist, 1)) * 180 / Math.PI, 12, 62);
  } else {
    cam.orbit = (cam.orbit || 0) + dt * 0.18;
    px = me.x + Math.cos(cam.orbit) * 70; py = me.y + Math.sin(cam.orbit) * 70; pz = me.z + 48;
    lx = me.x; ly = me.y; lz = me.z; fov = 55;
  }
  const hard = !cam.init || cam.mode !== camMode;
  const kp = camMode === 3 || camMode === 4 || camMode === 5 ? 1 : 1 - Math.exp(-dt * 10);
  if (hard) { cam.x = px; cam.y = py; cam.z = pz; }
  else { cam.x = lerp(cam.x, px, camMode === 4 ? 1 : kp); cam.y = lerp(cam.y, py, camMode === 4 ? 1 : kp); cam.z = lerp(cam.z, pz, camMode === 4 ? 1 : kp); }
  let fx = lx - cam.x, fy = ly - cam.y, fz = lz - cam.z; const fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;

const BOXES = [   // [x0,x1, y0,y1, z0,z1, kind]  (x fwd, y left, z up)

// minimap + profile
const mapc = $('mapc'), mctx = mapc.getContext('2d'), profc = $('profc'), pctx = profc.getContext('2d');

const zMax = Math.max(...R.z);
