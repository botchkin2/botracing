# Deletes a PR's Firebase preview channel when the PR is merged or closed.
# The project allows 50 channels; without this, old previews fill the quota
# and every new PR preview fails ("channel quota reached", HTTP 429).
# Run it by hand with a PR number to clean up one PR's channel.
name: Delete Firebase preview on PR close
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose preview channel to delete
        required: true
permissions:
  contents: read
# Shared with the preview deploy, so a deploy still running when the PR
# closes is cancelled instead of recreating the channel after the delete.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  delete_preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      # The Firebase CLI refuses to run without firebase.json. Take only that
      # file, from main, so no PR code is checked out next to the secret.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: firebase.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Delete this PR's preview channel(s)
        env:
          SERVICE_ACCOUNT: ${{ secrets.HOSTING_PREVIEW_SERVICE_ACCOUNT }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase hosting:channel:list --project botracing-61 --json > "$RUNNER_TEMP/channels.json" || true
          # The preview action names channels pr<N>-<branch, truncated>; match
          # on the pr<N>- prefix rather than rebuilding the name. Anything but a
          # success response is printed and fails the job.
          channels=$(node -e '
            const out = require("fs").readFileSync(process.argv[1], "utf8");
            let res;
            try { res = JSON.parse(out); } catch { res = null; }
            if (res?.status !== "success") { console.error(out); process.exit(1); }
            for (const c of res.result.channels ?? []) {
              const id = c.name.split("/").pop();
              if (id.startsWith(`pr${process.env.PR}-`)) console.log(id);
            }' "$RUNNER_TEMP/channels.json")
          if [ -z "$channels" ]; then echo "No preview channel for PR $PR."; exit 0; fi
          for c in $channels; do
            firebase hosting:channel:delete "$c" --project botracing-61 --force
          done
