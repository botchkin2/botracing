# Tests on every PR (no path filter), so "merge on green" means the tests
# passed, not only that the app built. The preview workflow only builds.
name: Tests
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Types
        run: npx tsc --noEmit
      - name: App tests
        run: npx jest
      # node --check only parses; no-undef is what catches a missing import (#206).
      - name: Tools - undefined names
        run: npx eslint "tools/**/*.mjs"
      # Errors fail the job (warnings do not): the same rules `npm run lint`
      # shows, so a missing import or a hook misuse is caught before merge.
      - name: App lint
        run: npx eslint src app
      - name: Uploader and session tools
        run: node --test tools/sessions/*.test.mjs tools/uploader/*.test.mjs tools/ci/*.test.mjs ops/backups/*.test.mjs
  # The functions had no CI of their own: their types and tests (the upload
  # endpoint, the read API's owner rules, the admin scripts) ran only by hand.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix functions
      - name: Types
        working-directory: functions
        run: npx tsc --noEmit
      - name: Functions tests
        run: node --test functions/test/*.test.mjs
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The writer tests read every column back with the DuckDB CLI (#140).
      - name: DuckDB CLI
        run: |
          curl -sSL -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.4.2/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$RUNNER_TEMP/duckdb"
          echo "DUCKDB=$RUNNER_TEMP/duckdb/duckdb" >> "$GITHUB_ENV"
      - name: Recorder tests
        working-directory: tools/capture
        run: uv run --group dev pytest -q
