# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
# Shared with the cleanup workflow (see firebase-hosting-pr-cleanup.yml).
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
        env:
          GARAGE61_API_TOKEN: ${{ secrets.GARAGE61_API_TOKEN }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install functions dependencies
        run: cd functions && npm install
      - name: Deploy to Firebase Hosting preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOTRACING_61 }}
          projectId: botracing-61
          entryPoint: .
          # Backstop for channels the cleanup workflow misses. A PR idle for
          # over 3 days loses its preview link; the next push brings it back.
          expires: 3d
