name: Deploy to Firebase Hosting on PR
# Only PRs that change what the web app serves get a preview; tools-only PRs
# (uploader, recorder, CI) skip it.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'public/**'
      - 'hooks/**'
      - 'constants/**'
      - 'tools/track-info/tracks.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.*'
      - 'firebase.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'tsconfig.json'
      - '.github/workflows/firebase-hosting-pull-request.yml'
permissions:
  checks: write
  contents: read
  pull-requests: write
# Shared with the cleanup workflow (see firebase-hosting-pr-cleanup.yml).
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # A healthy preview takes ~3 min; a hung deploy shouldn't block for hours.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Deploy to Firebase Hosting preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOTRACING_61 }}
          projectId: botracing-61
          entryPoint: .
          # Backstop for channels the cleanup workflow misses. A PR idle for
          # over 3 days loses its preview link; the next push brings it back.
          expires: 3d
