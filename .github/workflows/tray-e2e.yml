# The tray installer, end to end, on a clean Windows runner: build it from the
# PR's code, install it silently, start it, start it again, uninstall it
# (desktop/scripts/e2e-install.ps1). Runs on every PR that touches the tray or
# the uploader it carries; the check is `Tray installer end to end`.
#
# No secrets: the installer is the unsigned one, and the phases that need a
# signed-in run (uploader starts, heartbeat lands) are added when their
# credential design is agreed (pit wall thread 1 #3466).
name: Tray end to end
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'tools/uploader/**'
      - 'tools/sessions/**'
      - 'tools/capture/**'
      - '.github/workflows/tray-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tray-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Tray installer end to end
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      - name: Build an unsigned installer
        run: npx tauri build --config src-tauri/tauri.unsigned.conf.json

      - name: Install, launch, launch again, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer was built" }
          ./scripts/e2e-install.ps1 -Installer $setup.FullName
