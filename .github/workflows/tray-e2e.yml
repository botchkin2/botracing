# The tray installer, end to end, on clean Windows runners: build it from the
# PR's code once, then in every cell install it silently, start it, start it
# again three ways (path, 8.3 short name, extended-length path) and uninstall it
# (desktop/scripts/e2e-install.ps1). Cells: two Windows Server versions, the
# runner's admin account or a new standard user named "Test Ünïcode", and node
# on PATH as-is, absent, or a decoy that must never run. A release needs every
# cell green (pit wall thread 1 #3499).
#
# No secrets: the installer is the unsigned one, and the phases that need a
# signed-in run (uploader starts, heartbeat lands) are added when their
# credential design is agreed (pit wall thread 1 #3466).
name: Tray end to end
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'tools/uploader/**'
      - 'tools/sessions/**'
      - 'tools/capture/**'
      - '.github/workflows/tray-e2e.yml'
  workflow_dispatch:
    inputs:
      rehearsals:
        description: Run the update rehearsal this many times on one runner (roadmap row 4); 1 is the normal check
        type: number
        default: 1
  # "Release tray" (release-tray.yml, roadmap 2w) calls this with the one
  # installer it built and will ship: the cells install that exact file, and
  # the rehearsal updates N-1 to it, instead of building their own.
  workflow_call:
    inputs:
      candidate-artifact:
        description: The artifact holding the release's -setup.exe
        type: string
        required: true
      candidate-version:
        description: The version stamped into it (X.Y.Z)
        type: string
        required: true
      candidate-sha256:
        description: Its sha256 from the release's build; checked before any use
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # A release's call runs inside its own run; it never cancels a PR's.
  group: tray-e2e-${{ inputs.candidate-version && format('release-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the installer
    # A release brings its own installer (candidate-artifact); a rehearsal
    # loop (rehearsals > 1) is about the update only.
    if: ${{ !inputs.candidate-artifact && !(inputs.rehearsals > 1) }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      - name: Build an unsigned installer
        run: npx tauri build --config src-tauri/tauri.unsigned.conf.json

      - uses: actions/upload-artifact@v7
        with:
          name: e2e-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 3

  e2e:
    name: Tray installer end to end (${{ matrix.os }}, ${{ matrix.account }}, node ${{ matrix.node }})
    needs: build
    # Runs after this workflow's own build, or with the release's installer;
    # never in a rehearsal loop (rehearsals > 1), which is about the update only.
    if: ${{ !cancelled() && !(inputs.rehearsals > 1) && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.candidate-artifact)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        account: [runner, standard-user, standard-ascii]
        node: [as-is, none, decoy]
        exclude:
          # The decoy and the missing node are the same check as-is on an
          # account that has no node of its own; keep them on one OS each.
          - {os: windows-2025, account: runner, node: none}
          - {os: windows-2025, account: runner, node: decoy}
          # The plain-named standard user only separates the cause of a failure.
          - {os: windows-2022, account: standard-ascii, node: none}
          - {os: windows-2022, account: standard-ascii, node: decoy}
          - {os: windows-2025, account: standard-ascii, node: none}
          - {os: windows-2025, account: standard-ascii, node: decoy}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: desktop/scripts

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.candidate-artifact || 'e2e-installer' }}
          path: installer

      - name: Install, launch, launch again, uninstall
        shell: pwsh
        run: |
          if ("${{ inputs.candidate-sha256 }}") {
            $setup = Get-Item (./desktop/scripts/candidate.ps1 -Dir installer -Sha256 "${{ inputs.candidate-sha256 }}")
          } else {
            $setup = Get-ChildItem installer/*-setup.exe | Select-Object -First 1
            if (-not $setup) { throw "no installer was downloaded" }
          }
          if ("${{ matrix.account }}" -eq "runner") {
            ./desktop/scripts/e2e-install.ps1 -Installer $setup.FullName -Node ${{ matrix.node }}
          } elseif ("${{ matrix.account }}" -eq "standard-ascii") {
            ./desktop/scripts/e2e-as-user.ps1 -Installer $setup.FullName -Node ${{ matrix.node }} -Account ascii
          } else {
            ./desktop/scripts/e2e-as-user.ps1 -Installer $setup.FullName -Node ${{ matrix.node }}
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The update rehearsal (pit wall #4434/#4435): build N-1 and N from this code
  # with a throwaway updater key made here (no repository secret; the real key
  # stays in the tray-release Environment, and this never runs on Botkin's PC),
  # serve N from 127.0.0.1, and check an installed N-1 downloads N and comes
  # back as N after `botracing.exe --update` (the menu's "Restart to update";
  # CI cannot click the tray). Signed out, so the #511 restart symptom (a
  # signed-in tray after an update) is out of scope here. Green before a tag.
  update:
    name: Tray update rehearsal (N-1 to N)
    runs-on: windows-latest
    # About 3 min a rehearsal after the build.
    timeout-minutes: ${{ inputs.rehearsals > 1 && 180 || 45 }}
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    env:
      PORT: '8765'
      OLD: '0.0.1'
      # A release's rehearsal updates N-1 to the release itself.
      NEW: ${{ inputs.candidate-version || '0.0.2' }}
      CANDIDATE: ${{ inputs.candidate-artifact }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      - name: Make a throwaway updater key
        run: |
          $key = Join-Path $env:RUNNER_TEMP "rehearsal.key"
          npx tauri signer generate --ci -f -w $key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "KEY_FILE=$key" >> $env:GITHUB_ENV

      - uses: actions/download-artifact@v8
        if: ${{ inputs.candidate-artifact }}
        with:
          name: ${{ inputs.candidate-artifact }}
          path: ${{ runner.temp }}/candidate

      - name: Build N-1 and N
        run: |
          $pub = (Get-Content "$env:KEY_FILE.pub" -Raw).Trim()
          $out = Join-Path $env:RUNNER_TEMP "rehearsal"
          New-Item -ItemType Directory -Force $out | Out-Null
          function Build($version, [bool]$signed) {
            $cfg = @{
              version = $version
              bundle  = @{ createUpdaterArtifacts = $signed }
              plugins = @{ updater = @{
                pubkey = $pub
                endpoints = @("http://127.0.0.1:$env:PORT/latest.json")
                dangerousInsecureTransportProtocol = $true
              } }
            }
            $file = Join-Path $out "conf-$version.json"
            $cfg | ConvertTo-Json -Depth 6 | Set-Content $file -Encoding utf8NoBOM
            npx tauri build --config $file
            if ($LASTEXITCODE -ne 0) { throw "build of $version failed" }
            $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_$($version)_*-setup.exe" | Select-Object -First 1
            if (-not $setup) { throw "no installer for $version" }
            Copy-Item $setup.FullName (Join-Path $out "$version-setup.exe")
            if ($signed) { Copy-Item "$($setup.FullName).sig" (Join-Path $out "$version-setup.exe.sig") }
          }
          Build $env:OLD $false
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content $env:KEY_FILE -Raw
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
          if ($env:CANDIDATE) {
            # N is the exact installer the release ships, signed here with the
            # throwaway key N-1 trusts (a detached .sig; the exe is unchanged).
            $cand = Get-Item (& "$env:GITHUB_WORKSPACE/desktop/scripts/candidate.ps1" -Dir "$env:RUNNER_TEMP/candidate" -Sha256 "${{ inputs.candidate-sha256 }}")
            Copy-Item $cand.FullName (Join-Path $out "$env:NEW-setup.exe")
            npx tauri signer sign (Join-Path $out "$env:NEW-setup.exe")
            if ($LASTEXITCODE -ne 0) { throw "signing the candidate failed" }
            if (-not (Test-Path (Join-Path $out "$env:NEW-setup.exe.sig"))) { throw "no .sig beside the candidate" }
          } else {
            Build $env:NEW $true
          }
          Get-ChildItem $out | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }

      - name: Install N-1, update to N with --update, uninstall
        working-directory: .
        env:
          REHEARSALS: ${{ inputs.rehearsals || 1 }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP "rehearsal"
          if ([int]$env:REHEARSALS -gt 1) {
            ./desktop/scripts/e2e-update-loop.ps1 -Runs ([int]$env:REHEARSALS) -Old "$out/$env:OLD-setup.exe" -New "$out/$env:NEW-setup.exe" -Signature "$out/$env:NEW-setup.exe.sig" -Version $env:NEW -Port $env:PORT -Out "$env:RUNNER_TEMP/rehearsal-logs"
          } else {
            ./desktop/scripts/e2e-update.ps1 -Old "$out/$env:OLD-setup.exe" -New "$out/$env:NEW-setup.exe" -Signature "$out/$env:NEW-setup.exe.sig" -Version $env:NEW -Port $env:PORT
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The installer's last guard by construction: botracing.exe held with no
      # sharing for 3 s, and N must wait for it (hooks.nsh), not stop on
      # "Error opening file for writing" (pit wall thread 71).
      # A rehearsal loop (rehearsals > 1) runs it as many times, so a flake
      # shows in one run (same-branch dispatches cancel each other).
      - name: Install N over a held botracing.exe
        working-directory: .
        env:
          REHEARSALS: ${{ inputs.rehearsals || 1 }}
        run: |
          for ($i = 1; $i -le [int]$env:REHEARSALS; $i++) {
            Write-Host "exe lock $i of $env:REHEARSALS"
            # Null when the script runs no native command, and `$null -ne 0`
            # would end the loop with exit 0.
            $global:LASTEXITCODE = 0
            ./desktop/scripts/e2e-exe-lock.ps1 -Installer (Join-Path $env:RUNNER_TEMP "rehearsal/$env:NEW-setup.exe")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.rehearsals > 1 }}
        with:
          name: rehearsal-logs
          path: ${{ runner.temp }}/rehearsal-logs
          retention-days: 14
