# Deploy Firebase Functions
name: Deploy Firebase Functions and Firestore config
on:
  push:
    branches:
      - main
    # Only what the functions deploy reads; a UI or uploader merge rebuilds nothing.
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/firebase-functions-deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy_functions:
    runs-on: ubuntu-latest
    # Deploy credentials live in the `deploy` Environment (main only), not at
    # repo level where a PR branch could read them (ops/iam/ciSplit.mjs).
    environment: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Google's own action writes the key to a credentials file the Firebase CLI
      # reads (GOOGLE_APPLICATION_CREDENTIALS); no third-party action sees it.
      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOTRACING_61 }}

      - name: Install Firebase CLI globally
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        run: cd functions && npm install

      - name: Build functions
        run: cd functions && npm run build

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions,firestore --project botracing-61 --non-interactive
