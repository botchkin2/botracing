# Deploy Firebase Functions
name: Deploy Firebase Functions and Firestore config
on:
  push:
    branches:
      - main
    # Only what the functions deploy reads; a UI or uploader merge rebuilds nothing.
    paths:
      - 'functions/**'
      # analyzeApi bundles the session engine (functions/scripts/buildEngine.mjs):
      # an analysis change must reach the cloud, or opened sessions run old rules.
      - 'tools/sessions/**'
      - 'src/analysis/**'
      - 'src/design/carModels.ts'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/firebase-functions-deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy_functions:
    runs-on: ubuntu-latest
    # Deploy credentials live in the `deploy` Environment (main only), not at
    # repo level where a PR branch could read them (ops/iam/ciSplit.mjs).
    environment: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Google's own action writes the key to a credentials file the Firebase CLI
      # reads (GOOGLE_APPLICATION_CREDENTIALS); no third-party action sees it.
      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOTRACING_61 }}

      - name: Install Firebase CLI globally
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        run: cd functions && npm install

      - name: Build functions
        run: cd functions && npm run build

      # A transient Google error ("Container import failed", "Failed to list functions") failed 2 of the last 60 deploys,
      # and the Hosting deploy and the OTA update wait on this one, so each cost three failure emails (pit-wall ticket
      # 48). The deploy is idempotent: it runs once more after 30 s, and says what failed first as a warning
      # annotation, so a flake that turns frequent still shows. A second failure is red as before.
      - name: Deploy Firebase Functions
        run: |
          deploy() {
            firebase deploy --only functions,firestore --project botracing-61 --non-interactive 2>&1 | tee deploy.log
            return "${PIPESTATUS[0]}"
          }
          if ! deploy; then
            why=$(sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -m1 -E 'Error:|Could not|Failed' | cut -c1-200)
            echo "::warning::functions deploy retried after: ${why:-unknown error}"
            sleep 30
            deploy
          fi
