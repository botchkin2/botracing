# Keeps every toolchain current (Botkin, 2026-10-09: stay on current versions,
# never deprecated ones). Weekly, grouped so each ecosystem is one PR; a seat
# reviews and merges it like any other PR, with CI green.
#
# Minor and patch updates only. Major versions are deliberate work, not Monday
# noise: each one is a real PR with its blocker and migration noted in
# docs/MAJOR_UPGRADES.md. Every ecosystem ignores majors below.
#
# Paused for his month with no seats (ticket 65, pit-wall thread 122):
# open-pull-requests-limit 0 stops version-update PRs, so no weekly red CI
# mail reaches him. Security alerts and security-update PRs are not affected.
# The first seat back deletes the six limit lines.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 0
    groups: {actions: {patterns: ['*'], update-types: [minor, patch]}}
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 0
    groups: {app: {patterns: ['*'], update-types: [minor, patch]}}
    # The Expo SDK pins these as one set; upgrade them together with
    # `npx expo install --fix` on an SDK bump, never piecemeal.
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: '@expo-google-fonts/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-test-renderer'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-*/*'
      # Pinned exactly: three is 0.x, so every minor is breaking, and @types/three
      # changes the types the 3D tests use (0.186 failed tsc, #728).
      # docs/MAJOR_UPGRADES.md.
      - dependency-name: 'three'
      - dependency-name: '@types/three'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /functions
    schedule: {interval: weekly}
    open-pull-requests-limit: 0
    groups: {functions: {patterns: ['*'], update-types: [minor, patch]}}
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /desktop
    schedule: {interval: weekly}
    open-pull-requests-limit: 0
    groups: {desktop: {patterns: ['*'], update-types: [minor, patch]}}
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: {interval: weekly}
    open-pull-requests-limit: 0
    groups: {tray: {patterns: ['*'], update-types: [minor, patch]}}
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: uv
    directory: /tools/capture
    schedule: {interval: weekly}
    open-pull-requests-limit: 0
    groups: {capture: {patterns: ['*'], update-types: [minor, patch]}}
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
