# Keeps every toolchain current (Botkin, 2026-10-09: stay on current versions,
# never deprecated ones). Weekly, grouped so each ecosystem is one PR; a seat
# reviews and merges it like any other PR, with CI green.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ['*']}}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    groups: {app: {patterns: ['*']}}
    # The Expo SDK pins these as one set; upgrade them together with
    # `npx expo install --fix` on an SDK bump, never piecemeal.
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: '@expo-google-fonts/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-test-renderer'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-*/*'
  - package-ecosystem: npm
    directory: /functions
    schedule: {interval: weekly}
    groups: {functions: {patterns: ['*']}}
  - package-ecosystem: npm
    directory: /desktop
    schedule: {interval: weekly}
    groups: {desktop: {patterns: ['*']}}
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: {interval: weekly}
    groups: {tray: {patterns: ['*']}}
  - package-ecosystem: uv
    directory: /tools/capture
    schedule: {interval: weekly}
    groups: {capture: {patterns: ['*']}}
